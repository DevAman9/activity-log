name: Daily Activity

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Australia/Sydney"
    - cron: "41 13 * * *"
      timezone: "Australia/Sydney"
    - cron: "23 18 * * *"
      timezone: "Australia/Sydney"
    - cron: "11 23 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  commit-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Append activity timestamp
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity.txt

      - name: Commit and push
        run: |
          git config user.name "DevAman9"
          git config user.email "188023770+DevAman9@users.noreply.github.com"
          git add activity.txt
          git commit -m "update activity log"
          git push
